<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="../assets/effects/kenney-particle.png"><title>FX Lab — 継世の戦闘</title><link rel="stylesheet" href="fx-lab/reference-fx.css"><link rel="stylesheet" href="fx-lab/lab.css"></head>
<body><header><div><h1>FX Lab <span>継世の戦闘</span></h1><p>素材を選ぶ → 試す → 比べる。戦闘を起動しない、小さな試写室。</p></div><span class="local-badge">LOCAL ONLY · 外部送信なし</span></header>
<div id="localOnly" role="alert" hidden>ローカル専用です。127.0.0.1 または localhost でサーバーを起動してください。</div>
<main id="workspace">
 <aside class="panel assets"><h2>01 素材を選ぶ</h2><div class="pattern-tabs" role="group" aria-label="比較パターン"><button id="patternA" aria-pressed="true">A 本編を基準に</button><button id="patternB" aria-pressed="false">B 比較する素材</button></div>
 <label>パターン名<input id="patternLabel" maxlength="160"></label>
 <label>映像の形式<select id="visualMode"><option value="builtin">本編の自作エフェクト</option><option value="image">PNG / APNG / WebP</option><option value="sequence">PNG連番</option><option value="sheet">スプライトシート</option></select></label>
 <label id="builtinBox">自作FX<select id="builtinFx"></select></label>
 <div id="fileBox" hidden><label class="file-picker">映像ファイルを選択<input id="visualFiles" type="file" accept=".png,.apng,.webp,image/png,image/apng,image/webp" multiple></label><button id="sampleImage" class="quiet">既存の公開PNGで試す</button></div>
 <p id="visualInfo" class="asset-info"></p>
 <fieldset id="frameSettings" hidden><legend>フレーム指定</legend><div class="two"><label id="columnsBox">列<input id="columns" type="number" min="1" max="32" value="4"></label><label id="rowsBox">行<input id="rows" type="number" min="1" max="32" value="4"></label><label id="countBox">フレーム数<input id="frameCount" type="number" min="1" max="300" value="16"></label><label>FPS<input id="fps" type="number" min="1" max="120" value="24"></label></div></fieldset>
 <label>効果音<select id="soundMode"></select></label><label id="soundFileBox" class="file-picker" hidden>SEファイルを選択<input id="soundFile" type="file" accept=".wav,.mp3,.ogg,audio/wav,audio/mpeg,audio/ogg"></label><p id="soundInfo" class="asset-info"></p><button id="soundOnly" class="wide quiet">SEだけ試聴</button>
 <div class="presets"><h3>公開素材の組み合わせ</h3><div><button data-preset="slash">斬撃</button><button data-preset="heavy">重攻撃</button><button data-preset="poison">毒</button><button data-preset="ward">結界</button><button data-preset="heal">回復</button></div></div>
 </aside>
 <section class="preview-column"><div class="preview-heading"><h2>02 試写する</h2><label>ボス<select id="bossSelect"></select></label></div>
 <div id="sceneShell" class="stage"><div id="arena"><div class="stage-vignette"></div><figure class="player"><img id="heroFace" alt="夜刃の剣士"><figcaption>PLAYER</figcaption></figure><figure id="enemyShadow" class="boss"><img id="bossPortrait" alt="ボス"><figcaption id="bossCaption"></figcaption></figure><div id="playerHpTrack" aria-hidden="true"></div><div id="combatFxLayer" class="combat-fx-layer"></div><canvas id="fxCanvas" aria-label="選択したエフェクトのプレビュー"></canvas><img id="nativeFx" alt="アニメーション素材" hidden><div id="targetMarker" aria-hidden="true">＋</div></div><span id="previewBadge">パターン A</span></div>
 <div class="transport"><button id="play" class="primary">▶ 再生 / 最初から</button><button id="stop">■ 停止</button><button id="repeat">3回試聴</button><button id="compare">A → B 比較</button></div>
 <div class="play-options"><label class="check"><input id="loop" type="checkbox">ループ</label><label>間隔 <input id="gapMs" type="number" min="100" max="3000" step="100"> ms</label><button id="matchSettings" class="quiet">位置・速度・音量をA/Bで揃える</button></div>
 <p id="capability" class="notice"></p><div id="status" class="status" role="status" aria-live="polite">準備完了。再生で映像とSEを確認できます。</div>
 <p class="hint">Space：再生 / 停止。購入素材はファイル選択で開きます。素材本体は保存・送信しません。</p>
 <section class="save-panel"><h2>03 設定を持ち帰る</h2><label>設定名<input id="configName" maxlength="160"></label><div><button id="exportConfig">JSONを書き出す</button><button id="importConfig">JSONを読み込む</button><input id="configFile" type="file" accept=".json,application/json" hidden></div></section>
 </section>
 <aside class="panel adjust"><h2>調整 <span id="activePattern">A</span></h2>
 <label>命中先<select id="target"><option value="boss">ボス</option><option value="player">プレイヤー</option></select></label>
 <label>再生速度 <output id="speedOut"></output><input id="speed" type="range" min="0.25" max="2" step="0.05"></label><div class="speed-presets"><button data-speed="0.5">0.5×</button><button data-speed="0.75">0.75×</button><button data-speed="1">1×</button><button data-speed="1.5">1.5×</button></div>
 <label>表示サイズ <output id="sizeOut"></output><input id="size" type="range" min="32" max="1000" step="1"></label>
 <label>X座標 <output id="xOut"></output><input id="x" type="range" min="-600" max="600" step="1"></label>
 <label>Y座標 <output id="yOut"></output><input id="y" type="range" min="-600" max="600" step="1"></label>
 <label>透明度 <output id="opacityOut"></output><input id="opacity" type="range" min="0" max="1" step="0.01"></label>
 <label>回転 <output id="rotationOut"></output><input id="rotation" type="range" min="-180" max="180" step="1"></label><label class="check"><input id="flipX" type="checkbox">左右反転</label>
 <label>SE音量 <output id="volumeOut"></output><input id="volume" type="range" min="0" max="1" step="0.01"></label>
 <label>SEの遅延 <output id="audioDelayMsOut"></output><input id="audioDelayMs" type="range" min="-1000" max="1000" step="10"></label><small>＋：映像の後 / −：音を先に再生。音の速さ・音程は変更しません。</small>
 <label>静止画 / ネイティブ表示時間（ms）<input id="holdMs" type="number" min="200" max="5000" step="100"></label>
 </aside>
</main>
<script src="../assets/asset-map.js"></script><script src="fx-lab/core.js"></script><script src="fx-lab/media.js"></script><script src="../src/ui/combat-fx.js"></script><script src="fx-lab/lab.js"></script>
</body></html>
